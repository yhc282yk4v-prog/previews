name: expire-previews
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove expired previews
        run: python3 expire.py
      - name: Commit and rebuild Pages if anything was removed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "preview-expiry-bot"
            git config user.email "preview-expiry-bot@users.noreply.github.com"
            git add -A
            git commit -m "Take down expired previews"
            git push
            gh api -X POST "/repos/$GITHUB_REPOSITORY/pages/builds" || true
          fi
